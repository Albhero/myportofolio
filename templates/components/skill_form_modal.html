<div id="skillModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-40">
    <div class="bg-white rounded-lg w-full max-w-md p-6 shadow-xl">
        <h2 class="text-xl font-bold mb-4">Add New Skill</h2>
        <form id="addSkillForm" method="POST">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Skill Name</label>
                    {{ form.name }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Proficiency (1-100)</label>
                    {{ form.proficiency }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    {{ form.category }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Credential URL</label>
                    {{ form.credential_url }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    {{ form.description }}
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-100">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save Skill</button>
            </div>
        </form>
    </div>
</div>
